<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f5f0">
  <title>Staff sign in | bobbys-web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/home.html" aria-label="bobbys-web home">bobbys<span>-</span>web</a>
    <div class="top-note"><span>STAFF SIGN IN</span></div>
  </header>
  <main class="login-main">
    <p class="eyebrow">Private staff tools</p>
    <h1>Sign in.</h1>
    <p class="intro">Enter the staff password to manage the status board.</p>
    <form class="login-form" id="login-form">
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      </div>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="primary-button" type="submit">Sign in</button>
    </form>
    <a class="back-link login-back" href="/home.html">Public page</a>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
